<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · GiroRural</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="rural.css"><link rel="stylesheet" href="tema.css"></head><body><header class="top"><a class="brand" href="/">Giro<span>Rural</span></a><nav><a href="/login.html">Entrar</a></nav></header><main class="page" style="max-width:560px"><p class="eyebrow">COMECE GRATUITAMENTE</p><h1>Crie sua conta</h1><p class="lead">Sua conta começa com o papel de locatário. Um administrador pode atribuir o papel de proprietário às contas que anunciam equipamentos.</p><form id="formCadastro" class="panel"><div class="form-grid"><label>Nome<input id="nome" name="nome" maxlength="120" autocomplete="name" required></label><label>E-mail<input id="email" name="email" type="email" autocomplete="email" required></label><label>Senha<input id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" required></label></div><button class="button">Criar conta</button><p id="mensagem" role="status"></p></form></main><script src="cadastro.js"></script><script src="nav.js"></script></body></html>
