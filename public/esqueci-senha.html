<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar senha · GiroRural</title>

    <link
        rel="stylesheet"
        href="rural.css"
    >
<link rel="stylesheet" href="tema.css"></head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-title">

            <h1>
                GiroRural
            </h1>

            <p>
                Aluguel de máquinas e implementos agrícolas
            </p>

        </div>


        <h2>
            Recuperar senha
        </h2>


        <p>
            Informe o e-mail da sua conta.
            Você receberá um link para criar uma nova senha.
        </p>


        <form id="formEsqueciSenha">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="nome@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-auth"
            >
                Enviar link de recuperação
            </button>

        </form>


        <p id="mensagem"></p>


        <div class="auth-footer">

            <a href="/login.html">
                Voltar para o login
            </a>

        </div>

    </main>


    <script src="esqueci-senha.js"></script>

<script src="nav.js"></script></body>

</html>
