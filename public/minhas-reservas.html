<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Acompanhe suas solicitações de reserva no GiroRural."><title>Minhas reservas · GiroRural</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="rural.css"><link rel="stylesheet" href="tema.css">
<style>.reserva-card{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px;background:#fff;border:1px solid var(--gr-linha);border-radius:12px;box-shadow:var(--gr-sombra);margin-bottom:12px}.reserva-card img{width:120px;height:84px;object-fit:cover;border-radius:8px;background:#DCE7DA}.reserva-card h2{font-size:17px;margin:0 0 4px}.reserva-card p{margin:2px 0;color:var(--gr-cinza);font-size:14px}.reserva-card .lado{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}.reserva-card .valor{font-size:18px;font-weight:700;color:var(--gr-texto)}@media(max-width:700px){.reserva-card{grid-template-columns:84px minmax(0,1fr)}.reserva-card img{width:84px;height:64px}.reserva-card .lado{grid-column:1/-1;align-items:stretch;text-align:left}}</style></head>
<body><header class="top"><a class="brand" href="/">Giro<span>Rural</span></a><nav></nav></header>
<main class="page"><p class="eyebrow">Sua conta</p><h1>Minhas reservas</h1>
<div class="tabs" role="tablist" aria-label="Filtrar reservas"><button role="tab" aria-selected="true" data-filtro="andamento">Em andamento</button><button role="tab" aria-selected="false" data-filtro="historico">Histórico</button></div>
<p id="reservasStatus" class="notice" role="status" aria-live="polite">Carregando solicitações...</p><section id="listaReservas" hidden></section></main><script src="minhas-reservas.js"></script><script src="nav.js"></script></body>
</html>
